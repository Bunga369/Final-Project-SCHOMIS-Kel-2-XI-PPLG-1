    <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Password Baru - SCHOMIS</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div class="auth-page">
        <div class="auth-card simple">
            <div class="auth-form-side" style="flex:1;">
                <h1>Buat Password Baru</h1>
                <p class="subtitle">Verifikasi berhasil. Masukkan password baru kamu.</p>

                <form id="formResetPassword" novalidate>
                    <div class="form-group">
                        <label for="passwordBaru">Password Baru</label>
                        <input type="password" id="passwordBaru" name="passwordBaru" required minlength="6">
                    </div>

                    <button type="submit" class="btn-primary">Simpan Password Baru</button>

                    <p class="message" id="pesan"></p>
                </form>
            </div>
        </div>
    </div>

    <script src="/js/reset-password.js"></script>
</body>
</html>
