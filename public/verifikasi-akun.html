<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa/Ubah Password - SCHOMIS</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div class="auth-page">
        <div class="auth-card simple">
            <div class="auth-form-side" style="flex:1;">
                <h1>Lupa/Ubah Password</h1>
                <p class="subtitle">Masukkan username dan email yang terdaftar untuk verifikasi</p>

                <form id="formVerifikasi" novalidate>
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <button type="submit" class="btn-primary">Verifikasi</button>

                    <p class="message" id="pesan"></p>
                </form>

                <p class="link-text">Sudah ingat password? <a href="/login.html">Masuk di sini</a></p>
            </div>
        </div>
    </div>

    <script src="/js/verifikasi-akun.js"></script>
</body>
</html>
