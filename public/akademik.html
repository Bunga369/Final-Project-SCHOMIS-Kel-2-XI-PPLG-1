<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akademik - SCHOMIS</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-content">
            <div class="content-header">
                <h1>CLASSES</h1>
                <div class="kelas-dropdown">
                    <span class="breadcrumb-kelas" id="dropdownToggle">-  &#9662;</span>
                    <div class="kelas-dropdown-menu" id="dropdownMenu"></div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-toolbar">
                    <button class="btn-tambah" id="btnTambahMapel">+ Tambah Mapel</button>
                    <a href="#" id="linkKenaikanKelas" class="btn-tambah" style="text-decoration:none; display:inline-block;">Data Kenaikan Kelas</a>
                </div>
                <table>
                    <thead id="theadNilai"></thead>
                    <tbody id="tabelNilai"></tbody>
                </table>
                <p class="empty-state" id="emptyState" style="display:none;">Belum ada siswa di kelas ini.</p>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modalNilai">
        <div class="modal-box">
            <h2>Edit Nilai</h2>
            <form id="formNilai">
                <input type="hidden" id="siswaIdNilai">
                <div class="modal-grid">
                    <div class="form-group">
                        <label>NIS</label>
                        <input type="text" id="nisTampil" disabled>
                    </div>
                    <div class="form-group">
                        <label>Nama Siswa</label>
                        <input type="text" id="namaTampil" disabled>
                    </div>
                </div>
                <p style="font-weight:600; margin: 0.8rem 0 0.5rem; font-size:0.9rem;">Mata Pelajaran</p>
                <div class="modal-grid" id="containerNilaiMapel" style="grid-template-columns: 1fr 1fr;"></div>
                <p class="message error" id="pesanModal"></p>
                <div class="modal-actions">
                    <button type="button" class="btn-batal" id="btnBatalModal">Batal</button>
                    <button type="submit" class="btn-simpan">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="modalMapel">
        <div class="modal-box">
            <h2>Tambah Mata Pelajaran</h2>
            <form id="formMapel">
                <div class="form-group">
                    <label for="namaMapelBaru">Nama Mata Pelajaran</label>
                    <input type="text" id="namaMapelBaru" placeholder="Contoh: Fisika" required>
                </div>
                <p class="message error" id="pesanModalMapel"></p>
                <div class="modal-actions">
                    <button type="button" class="btn-batal" id="btnBatalModalMapel">Batal</button>
                    <button type="submit" class="btn-simpan">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/sidebar.js"></script>
    <script src="/js/akademik.js"></script>
    <script>renderSidebar('akademik');</script>
</body>
</html>
